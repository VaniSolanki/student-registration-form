<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
        <br>
    <br>
        <br>

    <form action="action.php">
        <h3>Personal Information</h3>
        <br>
        
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" >
        <br>
        <br>
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">
        <br>
        <br>
        <label>Date of Birth</label>
        <input type="date" placeholder="dd/mm/yyyy">
        <br>
        <br>
        <label>Gender</label>
        <label for="101">
            <input type="radio" value="Male" name="Gender" id="101">Male
        </label>
        <label for="102">
            <input type="radio" value="Female" name="Gender" id="102">Female
        </label>
        <hr>
        
         <h3>Academic Details</h3>
        <br>
        
        <p>Course</p>
        <select name="Course">
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="MBA">MBA</option>
            <option value="B.pharma">B.pharma</option>
        </select>
        <br>
        <br>
        <label>Enrollment Number</label>
        <input type="number" placeholder=" Enter your enrollment number">
        <br>
        <br>
        <p>Message</p>
        <label for="103">
        <textarea name="Message" placeholder="Any additional information" id="103" ></textarea>
        </label>
        <br>
        <br>
        <input type="Submit" value="Submit">


    </form>
    
</body>
</html>
